name: Deploy Cloudflare Edge Worker

# Deploys the velo-oracle-edge Cloudflare Worker on push to main.
# Also runs a post-deploy health probe to confirm the worker is live.
#
# Required GitHub secrets (add via repo Settings > Secrets > Actions):
#   CLOUDFLARE_API_TOKEN  — Cloudflare API token with Workers:Edit permission
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare account ID
#
# To get these:
#   1. https://dash.cloudflare.com/profile/api-tokens → Create Token → Workers Scripts:Edit
#   2. https://dash.cloudflare.com → right sidebar → Account ID
#
# Optional GitHub secrets (for KV rate-limiting):
#   CF_KV_RATE_LIMITER_ID — KV namespace ID for RATE_LIMITER binding

on:
  push:
    branches: [main]
    paths:
      - 'workers/velo-edge/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy target'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - development

jobs:
  deploy:
    name: Deploy Edge Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workers/velo-edge

    steps:
      - uses: actions/checkout@v7

      - name: Check required secrets
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN secret is not set."
            echo "::warning::Add it via: repo Settings > Secrets and variables > Actions > New repository secret"
            echo "::warning::Get token at: https://dash.cloudflare.com/profile/api-tokens"
            echo "SECRETS_MISSING=true" >> $GITHUB_ENV
          else
            echo "SECRETS_MISSING=false" >> $GITHUB_ENV
          fi

      - name: Install Wrangler
        if: env.SECRETS_MISSING == 'false'
        run: npm install -g wrangler

      - name: Deploy to Cloudflare Workers
        if: env.SECRETS_MISSING == 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ENV="${{ github.event.inputs.environment || 'production' }}"
          echo "Deploying to environment: ${ENV}"
          if [ "${ENV}" = "production" ]; then
            wrangler deploy --env production
          else
            wrangler deploy --env development
          fi

      - name: Post-deploy health probe
        if: env.SECRETS_MISSING == 'false'
        run: |
          echo "Waiting 5s for worker to propagate..."
          sleep 5
          RESPONSE=$(curl -s -o /tmp/edge_probe.json -w "%{http_code}" \
            --max-time 15 \
            "https://velo-oracle-edge.workers.dev/velo/test")
          echo "HTTP status: ${RESPONSE}"
          cat /tmp/edge_probe.json
          echo ""
          if [ "${RESPONSE}" != "200" ]; then
            echo "WARN: Edge worker probe returned ${RESPONSE} (may be propagating)"
          else
            echo "SUCCESS: Edge worker is live"
          fi

      - name: Secrets missing — skip deploy
        if: env.SECRETS_MISSING == 'true'
        run: |
          echo "=== DEPLOY SKIPPED — Cloudflare secrets not configured ==="
          echo ""
          echo "To enable automatic deployment, add these GitHub repository secrets:"
          echo "  CLOUDFLARE_API_TOKEN  — Workers:Edit API token"
          echo "  CLOUDFLARE_ACCOUNT_ID — Your Cloudflare account ID"
          echo ""
          echo "Get token: https://dash.cloudflare.com/profile/api-tokens"
          echo "Get account ID: https://dash.cloudflare.com (right sidebar)"
          echo ""
          echo "To deploy manually:"
          echo "  cd workers/velo-edge"
          echo "  CLOUDFLARE_API_TOKEN=<token> wrangler deploy --env production"

      - name: Summary
        if: always()
        run: |
          echo "=== Edge Worker Deploy Summary ==="
          echo "Branch     : ${{ github.ref_name }}"
          echo "Commit     : ${{ github.sha }}"
          echo "Actor      : ${{ github.actor }}"
          echo "Run URL    : https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
