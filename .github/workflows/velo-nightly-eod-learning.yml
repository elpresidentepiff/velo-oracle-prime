name: VÉLØ Nightly EOD Learning

on:
  schedule:
    - cron: '0 23 * * *' # Every night at 11 PM UTC
  workflow_dispatch:
    inputs:
      date:
        description: 'Target date (YYYY-MM-DD)'
        required: false

jobs:
  learn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Tests
        run: |
          PYTHONPATH=. python3 -m unittest tests/test_nightly_eod_learning_runner.py

      - name: Execute Nightly Learning
        run: |
          DATE_ARG=""
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ github.event.inputs.date }}" ]; then
            DATE_ARG="--date ${{ github.event.inputs.date }}"
          fi
          PYTHONPATH=. python3 scripts/nightly_eod_learning_runner.py $DATE_ARG

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-learning-reports
          path: |
            data/nightly_eod_learning_status_*.json
            data/nightly_eod_learning_failures_*.json
            data/nightly_eod_learning_council_audit_*.json
