# Dedicated Railway cron worker for governed Velo EOD.
#
# The morning worker is intentionally separate.  This worker reconstructs the
# scored RP race universe from Supabase, captures authoritative RP result HTML,
# and runs the existing EOD/Sigma/Council/Mission-Control/learning sequence.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.rpcapture"

[deploy]
# Each 21:00 UTC run first settles any of the last 14 days that were scored but never settled
# (EOD_CATCH_UP_DAYS), oldest first, then today. A missed night is healed by the next run.
startCommand = "python scripts/ops/rp_cloud_eod.py --execute --no-notify"
cronSchedule = "0 21 * * *"
restartPolicyType = "NEVER"
