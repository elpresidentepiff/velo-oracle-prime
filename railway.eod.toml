# Dedicated Railway cron worker for governed Velo EOD.
#
# The morning worker is intentionally separate.  This worker reconstructs the
# scored RP race universe from Supabase, captures authoritative RP result HTML,
# and runs the existing EOD/Sigma/Council/Mission-Control/learning sequence.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.rpcapture"

[deploy]
startCommand = "python scripts/ops/rp_cloud_eod.py --date 2026-11-08 --execute --no-notify"
# cronSchedule temporarily disabled to force an immediate out-of-band run that re-settles
# 2026-11-08 after last night's two failures; restored verbatim right after this run completes.
restartPolicyType = "NEVER"
