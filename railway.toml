[build]
builder = "NIXPACKS"
# deploy: 2026-04-17T19:35Z
buildCommand = "pip install -r requirements_production.txt"

[deploy]
# The service builds from the Dockerfile, and Railway runs startCommand in exec form: no
# shell, so ${PORT:-8080} reached uvicorn literally ("is not a valid integer") and the
# container crash-looped behind a SUCCESS deploy and a 502 (found 2026-09-13 in the
# runtime log). sh -c makes the expansion happen.
startCommand = "sh -c 'uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8080}'"
restartPolicyType = "ON_FAILURE"
# Readiness gate: Railway keeps the previous deployment serving until this path answers
# 200, and abandons a deployment that never does. Without it every deploy gave ~2.5 min
# of 502 while the app started (2026-09-13). A [healthcheck] table used to sit here;
# Railway does not read that key, so no check ever ran.
#
# "/" not "/health": /health returns 503 whenever the last scoring run is > 26 h old,
# which would block every deploy after the laptop misses a race day. "/" answers only
# once FastAPI startup (including the Supabase schema verification) has completed, so
# it catches the import crash and the unexpanded-${PORT} crash that kept this service
# down from 2026-08-08 to 2026-09-13.
healthcheckPath = "/"
healthcheckTimeout = 300

# ── Scoring cron ──────────────────────────────────────────────────────────────
# This documents the intended schedule. Railway stores service config server-side.
# If the cron is lost after a redeploy, re-register via Railway dashboard or API:
#   serviceInstanceUpdate(serviceId, environmentId, { cronSchedule: "0 9 * * 1-6" })
# Service: velo-prime-scoring
# Schedule: 09:00 UTC Mon-Sat (covers UK flat/NH season)
# Command: python scripts/ops/run_prime_today.py
# cronSchedule = "0 9 * * 1-6"
